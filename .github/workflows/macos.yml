name: macOS build

# Builds the universal .dmg on a real macOS runner. The Windows-only modules must
# be ported first (see docs/MACOS.md); until then this workflow fails on purpose
# instead of shipping a broken package.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build universal app
        run: npm run tauri build -- --target universal-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: isle-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isle — Screenshot</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #05070d;
        color: #f8fafc;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      }

      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        cursor: grab;
        background:
          radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.12), transparent 55%),
          #05070d;
      }

      #app:active {
        cursor: grabbing;
      }

      #app.editing {
        cursor: default;
        background: #05070d;
      }

      #shot {
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
        transform-origin: center center;
        transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1);
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.65);
        border-radius: 4px;
      }

      #pad {
        position: fixed;
        inset: 0;
        margin: auto;
        max-width: 100vw;
        max-height: 100vh;
        width: auto;
        height: auto;
        display: none;
        cursor: crosshair;
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.65);
        border-radius: 4px;
        touch-action: none;
      }

      #pad.show {
        display: block;
      }

      #bar,
      #editor-bar {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px;
        border-radius: 14px;
        background: rgba(10, 15, 25, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.22);
        backdrop-filter: blur(16px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        z-index: 5;
        animation: bar-in 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      }

      #editor-bar {
        display: none;
        flex-wrap: wrap;
        justify-content: center;
        max-width: min(96vw, 760px);
      }

      #editor-bar.show {
        display: flex;
      }

      @keyframes bar-in {
        from {
          opacity: 0;
          transform: translate(-50%, -8px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0) scale(1);
        }
      }

      button {
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(148, 163, 184, 0.1);
        color: #f8fafc;
        border-radius: 9px;
        padding: 7px 11px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        transition:
          background 0.16s ease,
          border-color 0.16s ease,
          transform 0.16s cubic-bezier(0.34, 1.3, 0.64, 1);
      }

      button:hover {
        background: rgba(148, 163, 184, 0.2);
        border-color: rgba(148, 163, 184, 0.35);
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0) scale(0.96);
      }

      button.primary {
        background: #3b82f6;
        border-color: transparent;
      }

      button.tool {
        width: 32px;
        height: 30px;
        display: grid;
        place-items: center;
        padding: 0;
        font-size: 14px;
      }

      button.tool.active {
        background: #3b82f6;
        border-color: transparent;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
      }

      #text-input {
        width: 150px;
        height: 30px;
        border-radius: 9px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(148, 163, 184, 0.1);
        color: #f8fafc;
        padding: 0 9px;
        font: inherit;
        font-size: 12px;
        display: none;
      }

      #text-input.show {
        display: block;
      }

      #color {
        width: 34px;
        height: 30px;
        padding: 0;
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 9px;
        background: transparent;
        cursor: pointer;
      }

      #width {
        width: 84px;
        accent-color: #3b82f6;
      }

      #hint {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(10, 15, 25, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.18);
        color: #94a3b8;
        font-size: 11px;
        white-space: nowrap;
        z-index: 5;
        opacity: 0.9;
      }

      #toast {
        position: fixed;
        left: 50%;
        top: 74px;
        transform: translateX(-50%) translateY(-8px);
        padding: 7px 13px;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.18);
        border: 1px solid rgba(34, 197, 94, 0.4);
        color: #bbf7d0;
        font-size: 11px;
        opacity: 0;
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 6;
        pointer-events: none;
      }

      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <img id="shot" alt="Screenshot" />
      <canvas id="pad" aria-label="Screenshot editor"></canvas>
    </div>

    <div id="bar">
      <button id="zoom-out" title="−">−</button>
      <button id="zoom-reset" title="100%">100%</button>
      <button id="zoom-in" title="+">+</button>
      <button id="edit">Редагувати</button>
      <button id="copy">Копіювати</button>
      <button id="close">Закрити</button>
    </div>

    <div id="editor-bar">
      <button class="tool active" data-tool="crop" title="Обрізати">✂</button>
      <button class="tool" data-tool="pen" title="Пензель">✎</button>
      <button class="tool" data-tool="eraser" title="Гумка">⌫</button>
      <button class="tool" data-tool="rect" title="Прямокутник">▭</button>
      <button class="tool" data-tool="arrow" title="Стрілка">↗</button>
      <button class="tool" data-tool="text" title="Текст">T</button>
      <input id="text-input" placeholder="Текст…" />
      <input id="color" type="color" value="#ef4444" title="Колір" />
      <input id="width" type="range" min="1" max="24" value="6" title="Товщина" />
      <button id="undo" title="Скасувати останню дію">↶</button>
      <button id="save" class="primary">Зберегти</button>
      <button id="cancel">Скасувати</button>
    </div>

    <div id="hint">Колесо — масштаб · перетягування — панорама · подвійний клік — 100%</div>
    <div id="toast"></div>
    <script type="module" src="/src/capture-view.ts"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isle — Screenshot</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #05070d;
        color: #f8fafc;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      }

      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        cursor: grab;
        background:
          radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.12), transparent 55%),
          #05070d;
      }

      #app:active {
        cursor: grabbing;
      }

      #shot {
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
        transform-origin: center center;
        transition: transform 0.12s ease-out;
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.65);
        border-radius: 4px;
      }

      #bar {
        position: fixed;
        top: 18px;
        right: 18px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px;
        border-radius: 12px;
        background: rgba(10, 15, 25, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.22);
        backdrop-filter: blur(14px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        z-index: 5;
      }

      button {
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(148, 163, 184, 0.1);
        color: #f8fafc;
        border-radius: 8px;
        padding: 7px 11px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease;
      }

      button:hover {
        background: rgba(148, 163, 184, 0.2);
      }

      button:active {
        transform: scale(0.96);
      }

      button.primary {
        background: #3b82f6;
        border-color: transparent;
      }

      #hint {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(10, 15, 25, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.18);
        color: #94a3b8;
        font-size: 11px;
        white-space: nowrap;
        z-index: 5;
        opacity: 0.9;
      }

      #toast {
        position: fixed;
        left: 50%;
        top: 22px;
        transform: translateX(-50%) translateY(-8px);
        padding: 7px 13px;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.18);
        border: 1px solid rgba(34, 197, 94, 0.4);
        color: #bbf7d0;
        font-size: 11px;
        opacity: 0;
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 6;
        pointer-events: none;
      }

      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <img id="shot" alt="Screenshot" />
    </div>
    <div id="bar">
      <button id="zoom-out" title="−">−</button>
      <button id="zoom-reset" title="100%">100%</button>
      <button id="zoom-in" title="+">+</button>
      <button id="copy" class="primary">Копіювати</button>
      <button id="close">Закрити</button>
    </div>
    <div id="hint">Колесо — масштаб · перетягування — панорама · Esc — закрити</div>
    <div id="toast">Скопійовано в буфер</div>
    <script type="module" src="/src/capture-view.ts"></script>
  </body>
</html>
